 textLength="211.8784" x="996.63" y="330.3966">for static composition). The Rust</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="255.7344" x="996.63" y="345.5294">bridge reaches the Frontend/Recorders</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="200.2368" x="996.63" y="360.6622">the same way, via direct static</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="228.0776" x="996.63" y="375.795">linkage rather than backend_table.</text></g><!--link Frontend to Console--><g id="link_Frontend_Console"><path d="M1685,154.6628 C1685,176.1528 1685,202.8628 1685,202.8628 C1685,202.8628 1415,202.8628 1415,202.8628 C1415,202.8628 1415,240.8528 1415,270.5728 " fill="transparent" id="Frontend-to-Console" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="1415,276.5728,1419,267.5728,1415,271.5728,1411,267.5728,1415,276.5728" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="187.8081" x="1349.24" y="198.9297">static composition (baseline)</text></g><!--link Frontend to FrontendPlan--><g id="link_Frontend_FrontendPlan"><path d="M1741.54,154.6828 C1741.54,187.2128 1741.54,242.0328 1741.54,275.1928 " fill="transparent" id="Frontend-FrontendPlan" style="stroke:#181818;stroke-width:1;stroke-dasharray:7.0,7.0;"/></g><!--link Recorders to Integration--><g id="link_Recorders_Integration"><path d="M414.34,127.8628 C308.76,127.8628 165,127.8628 165,127.8628 C165,127.8628 165,221.5228 165,270.5728 " fill="transparent" id="Recorders-to-Integration" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="165,276.5728,169,267.5728,165,271.5728,161,267.5728,165,276.5728" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="115.1147" x