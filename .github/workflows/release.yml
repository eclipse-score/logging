# *******************************************************************************
# Manually triggered: runs the Linux and QNX coverage workflows and creates a
# draft release with both coverage reports attached as separate archives. The
# LLVM (Linux) and gcov (QNX) reports are not comparable line by line, so they
# are not merged.
name: Release
run-name: Release ${{ inputs.tag }}
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: true
        type: string
concurrency:
  group: release
jobs:
  coverage-linux:
    uses: ./.github/workflows/coverage_report.yml
    permissions:
      contents: read
      pull-requests: read
  coverage-qnx:
    uses: ./.github/workflows/coverage_report_qnx.yml
    permissions:
      contents: read
      pull-requests: read
      actions: write
    secrets: inherit
  create-release:
    needs: [coverage-linux, coverage-qnx]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      LINUX_ARCHIVE: ${{ github.event.repository.name }}-${{ inputs.tag }}-cpp-coverage-linux
      QNX_ARCHIVE: ${{ github.event.repository.name }}-${{ inputs.tag }}-cpp-coverage-qnx
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Get Current Date and Previous Release Tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREVIOUS_TAG=$(gh release view --json tagName --jq '.tagName' 2>/dev/null || echo "N/A")
          echo "RELEASE_DATE=$(date --rfc-3339=date)" >> $GITHUB_ENV
          echo "PREVIOUS_RELEASE_TAG=$PREVIOUS_TAG" >> $GITHUB_ENV
      - name: Generate Release Body
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          COMMIT_SHA: ${{ github.sha }}
          ACTION_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          envsubst '$RELEASE_TAG $PREVIOUS_RELEASE_TAG $COMMIT_SHA $RELEASE_DATE $ACTION_RUN_URL' < .github/RELEASE_TEMPLATE.md > release_body.md
      - name: Download Linux Coverage Report Artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ github.event.repository.name }}_cpp_coverage
          path: ${{ env.LINUX_ARCHIVE }}
      - name: Download QNX Coverage Report Artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ github.event.repository.name }}_cpp_coverage_report_qnx
          path: ${{ env.QNX_ARCHIVE }}
      - name: Create Coverage Report Archives
        run: |
          set -euo pipefail
          for archive in "$LINUX_ARCHIVE" "$QNX_ARCHIVE"; do
            tar --sort=name --owner=0 --group=0 --numeric-owner \
              -cJf "$archive.tar.xz" "$archive"
          done
      - name: Create Draft Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          body_path: release_body.md
          draft: true
          generate_release_notes: true
          target_commitish: ${{ github.sha }}
          files: |
            ${{ env.LINUX_ARCHIVE }}.tar.xz
            ${{ env.QNX_ARCHIVE }}.tar.xz
