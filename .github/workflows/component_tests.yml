name: Component Tests

# Triggered via docs.yml (pull_request, push, merge_group) so that the docs build
# can consume the test reports for requirement traceability.
on:
  workflow_call:
    outputs:
      artifact-name:
        description: Artifact with the component test XML and log reports.
        value: ${{ jobs.component-tests.outputs.artifact-name }}
  workflow_dispatch: {}

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  REPORT_ARTIFACT: logging_component_tests

jobs:
  component-tests:
    name: Run Component Tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      artifact-name: ${{ steps.upload.outputs.artifact-id && env.REPORT_ARTIFACT || '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-version: 1.26.0
          disk-cache: true
          repository-cache: true
          bazelisk-cache: true

      - name: Bazel info (discover paths)
        id: bazel-info
        run: |
          echo "BAZEL_OUTPUT_BASE=$(bazel info output_base)" >> $GITHUB_ENV
          echo "BAZEL_REPO_CACHE=$(bazel info repository_cache)" >> $GITHUB_ENV
          bazel info

      - name: Cache Bazel output base
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.BAZEL_OUTPUT_BASE }}/action_cache
            ${{ env.BAZEL_OUTPUT_BASE }}/bazel-out
            ${{ env.BAZEL_OUTPUT_BASE }}/external
            ${{ env.BAZEL_OUTPUT_BASE }}/execroot
          key: bazel-ob-component-v3-${{ runner.os }}-${{ hashFiles('.bazelversion', 'MODULE.bazel', 'MODULE.bazel.lock', '**/*.bzl') }}
          restore-keys: |
            bazel-ob-component-v3-${{ runner.os }}-

      - name: Run component tests
        run: |
          bazel test --lockfile_mode=error --config score-linux-x86_64 \
            --test_tag_filters=integration \
            --test_output=errors \
            //score/test/component/...

      # Docs downloads these reports to trace requirement IDs of the tests.
      - name: Upload test reports
        id: upload
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.REPORT_ARTIFACT }}
          path: |
            bazel-testlogs/**/*.xml
            bazel-testlogs/**/*.log
          if-no-files-found: error
