# Every test tagged `integration` but not `integration_long`.
# The integration tests run in the merge queue, so only reviewed and
# queued code uses the QNX runners. Tests tagged `integration_long` (more than ~2
# minutes) run in nightly_full_evidence_docs.yml.
#
# The `test.xml` results are kept as the `qnx-itf-test-results` artifact. The nightly
# workflow reuses them as verification evidence for the same commit on `main`.

name: QNX Integration Tests

on:
  merge_group:
    types: [checks_requested]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-tests-qnx:
    name: QNX Integration Tests (x86_64-qnx)
    uses: ./.github/workflows/qnx_itf.yml
    with:
      cache-save: ${{ github.event_name == 'merge_group' }}
      # Must outlive the time until the nightly run that reuses them.
      results-retention-days: 10
    secrets:
      SCORE_QNX_LICENSE: ${{ secrets.SCORE_QNX_LICENSE }}
      SCORE_QNX_USER: ${{ secrets.SCORE_QNX_USER }}
      SCORE_QNX_PASSWORD: ${{ secrets.SCORE_QNX_PASSWORD }}
    permissions:
      contents: read
      pull-requests: read
