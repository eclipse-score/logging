name: Publish Docs

on:
  workflow_run:
    workflows: ["Test and Build Docs"]
    types: [completed]

jobs:
  docs-publish:
    if: github.event.workflow_run.conclusion == 'success'
    uses: eclipse-score/cicd-workflows/.github/workflows/docs-publish.yml@f77ed751fa587e3a1142b2d85320917e00c888ae # main (2026-10)
    permissions:
      actions: read
      contents: write
      id-token: write
      pages: write
      pull-requests: write
