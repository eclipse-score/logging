name: Dependency reports up to date

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
    types: [checks_requested]

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-version: 1.26.0
          repository-cache: true
          bazelisk-cache: true

      - name: Check the committed dependency pages
        run: python3 scripts/generate_dependency_report.py scripts/dependency_reports/dependency_report_*.json --check
