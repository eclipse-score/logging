name: CodeQL

permissions:
  contents: read

on:
  pull_request:
  merge_group:
    types: [checks_requested]

jobs:
  codeql:
    name: CodeQL
    uses: ./.github/workflows/_codeql.yml
    permissions:
      contents: read
      actions: write
      security-events: write
    with:
      fail-on-findings: "true"
