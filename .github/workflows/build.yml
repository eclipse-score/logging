name: Bazel Build

on:
  pull_request:
    types: [opened, reopened, synchronize]
  # bazel.yml saves caches only from the default branch.
  push:
    branches:
      - main
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  build:
    name: Build Bazel Code
    permissions:
      contents: read
      # Allows bazel.yml to prune replaced cache generations once it supports this.
      actions: write
    uses: eclipse-score/cicd-workflows/.github/workflows/bazel.yml@419f87cb66c1a0eb444416ae47c4c97bdc5732fc # bazel/v0.1.0
    with:
      # Exclude targets that are not expected to build the source code, e.g. documentation, format check, live preview, product integration tests.
      # Please execute "bazel query 'kind(rule, //:*)'" to find the list of all excluded targets by this option.
      build-targets: //... -//:* -//score/test/component/...
      # Component tests run in component_tests.yml; exclude here to avoid pulling in QNX deps.
      test-targets: //score/... -//score/test/component/...
      bazel-configs: score-linux-x86_64
      test-args: --test_tag_filters=-no_ci
      cache-key: linux-x86_64
