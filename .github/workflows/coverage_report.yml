name: Code coverage (LLVM, C++ + Rust)

on:
  workflow_call:

jobs:
  approval:
    name: coverage approval gate
    if: github.event_name == 'pull_request_target' || github.event_name == 'pull_request'
    environment: workflow-approval
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Blocking on approval
        run: 'true'

  coverage-report:
    if: ${{ !cancelled() }}
    needs: approval
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-coverage
          repository-cache: true
          cache-save: ${{ github.event_name == 'push' }}

      # Unified LLVM source-based coverage (C++ + Rust) from @score_tooling//coverage,
      # see quality/coverage/. Integration tests need docker/QNX and are excluded via
      # the llvm_cov config's test tag filter.
      - name: Run coverage
        run: |
          set -euo pipefail
          bazel coverage --lockfile_mode=error --config=llvm_cov \
            //score/... --build_tests_only

      - name: Generate coverage report
        env:
          # Report-only during the introduction phase (the previous workflow had no
          # gate either). Raise stepwise toward 100 as tests/justifications land.
          # The markdown summary lands on this run's page via GITHUB_STEP_SUMMARY.
          COVERAGE_THRESHOLD: "0"
        run: |
          set -euo pipefail
          bazel run --lockfile_mode=error @score_tooling//coverage:generate_coverage_html -- \
            --testlogs-subdir score \
            --archive-dir coverage_artifact

      # Artifact name kept: docs.yml downloads it as `tests-report-artifact`.
      # upload-artifact zips its input itself; the script assembles an unzipped
      # directory (--archive-dir) to avoid a zip inside a zip.
      - name: Upload coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}_cpp_coverage
          path: coverage_artifact
          if-no-files-found: ignore
