name: Sanitizers

on:
  pull_request:
    types: [opened, reopened, synchronize]
  # bazel.yml saves caches only from the default branch.
  push:
    branches:
      - main
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  sanitizer-tests:
    name: Bazel Tests (${{ matrix.sanitizer_config }})
    permissions:
      contents: read
      # Allows bazel.yml to prune replaced cache generations once it supports this.
      actions: write
    uses: eclipse-score/cicd-workflows/.github/workflows/bazel.yml@419f87cb66c1a0eb444416ae47c4c97bdc5732fc # bazel/v0.1.0
    strategy:
      fail-fast: false
      matrix:
        sanitizer_config: [asan_ubsan_lsan, tsan]
    with:
      test-targets: //score/...
      bazel-configs: ${{ matrix.sanitizer_config }}
      # Note: Scoped to C/C++ targets only. Rust targets require Rust-specific
      # sanitizer handling and are excluded via tag filters.
      test-args: --build_tests_only --test_lang_filters=cc --build_tag_filters=-rust,-integration --test_tag_filters=-rust,-integration --verbose_failures
      cache-key: sanitizers-${{ matrix.sanitizer_config }}
