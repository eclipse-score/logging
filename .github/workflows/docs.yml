name: Test and Build Docs

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
    types: [checks_requested]

jobs:
  run-tests:
    uses: ./.github/workflows/coverage_report.yml
    permissions:
      contents: read
      pull-requests: read

  build-docs:
    needs: [run-tests]
    if: ${{ needs.run-tests.result == 'success' }}
    uses: eclipse-score/cicd-workflows/.github/workflows/docs.yml@f77ed751fa587e3a1142b2d85320917e00c888ae # main (2026-10)
    permissions:
      contents: read
    with:
      # Appended to `bazel run`; setup-bazel-cache applies the caches to every bazel call in the job.
      bazel-target: >-
        --lockfile_mode=error //:docs -- --github_user=${{ github.repository_owner }} --github_repo=${{ github.event.repository.name }} && bazel run --lockfile_mode=error //:publish_dependable_element_reports
      retention-days: 3
      tests-report-artifact: logging_cpp_coverage
