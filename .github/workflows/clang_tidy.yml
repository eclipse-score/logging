name: Clang-Tidy

on:
  pull_request:
    types: [opened, reopened, synchronize]
  # bazel.yml saves caches only from the default branch.
  push:
    branches:
      - main
  merge_group:

permissions:
  contents: read

concurrency:
  group: clang-tidy-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  clang-tidy:
    permissions:
      contents: read
      # Allows bazel.yml to prune replaced cache generations once it supports this.
      actions: write
    uses: eclipse-score/cicd-workflows/.github/workflows/bazel.yml@419f87cb66c1a0eb444416ae47c4c97bdc5732fc # bazel/v0.1.0
    with:
      # comp_req__log__avoid_signal_processing applies to mw::log cpp implementation only.
      build-targets: //score/mw/log/... -//score/mw/log/rust/...
      build-args: --config=banned-functions
      # Scope limited to C++ targets. Rust targets are not yet validated against
      # this configuration and are explicitly excluded.
      test-targets: //score/mw/log/... //score/datarouter/... -//score/mw/log/rust/...
      test-args: --config=clang-tidy
      timeout-minutes: 35
      cache-key: clang-tidy
