name: Clang-Tidy

on:
  pull_request:
    types: [opened, reopened, synchronize]
  merge_group:

permissions:
  contents: read

concurrency:
  group: clang-tidy-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  clang-tidy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-version: 1.26.0
          disk-cache: clang-tidy
          repository-cache: true
          external-cache: true
      - name: Run clang-tidy
        # Scope limited to C++ targets. Rust targets are not yet validated against
        # this configuration and are explicitly excluded.
        run: bazel test --config=clang-tidy --lockfile_mode=error -- //score/mw/log/... //score/datarouter/... -//score/mw/log/rust/...
      - name: Check banned functions
        # comp_req__log__avoid_signal_processing applies to mw::log cpp implementation only.
        run: bazel build --config=banned-functions --lockfile_mode=error -- //score/mw/log/... -//score/mw/log/rust/...
