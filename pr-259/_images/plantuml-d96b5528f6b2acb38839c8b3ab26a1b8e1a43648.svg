<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="558px" preserveAspectRatio="none" style="width:1886px;height:558px;background:#FFFFFF;" version="1.1" viewBox="0 0 1886 558" width="1886px" zoomAndPan="magnify"><title>mw::log (ASIL B): repository boundary</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="303.3516" x="784.8091" y="22.9951">mw::log (ASIL B): repository boundary</text><!--cluster Baselibs--><g id="cluster_Baselibs"><rect fill="#FFFFE0" height="320" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:1;" width="499" x="397.5" y="44.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="114.8984" x="589.5508" y="59.292">score_baselibs</text></g><!--cluster Logging--><g id="cluster_Logging"><rect fill="#ADD8E6" height="299.5" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:1;" width="651" x="936.5" y="244.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="108.8965" x="1207.5518" y="259.292">score_logging</text></g><!--cluster Future--><g id="cluster_Future"><rect fill="#F5F5F5" height="120" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:1;" width="253" x="104.5" y="44.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="203.7314" x="129.1343" y="59.292">Optional Future Evolution</text></g><!--entity Frontend--><g id="elem_Frontend"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="226.165" x="552.5" y="87.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="150.0215" x="562.5" y="110.292">mw::log Frontend API</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="206.165" x="562.5" y="126.5889">(logger, log_stream, runtime)</text></g><!--entity Console--><g id="elem_Console"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="140.3877" x="421.5" y="287.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="120.3877" x="431.5" y="310.292">Console Backend</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="107.1055" x="431.5" y="326.5889">(static, built-in)</text></g><!--entity FrontendPlan--><g id="elem_FrontendPlan"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="268.2607" x="596.5" y="287.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="145.4277" x="606.5" y="310.292">Frontend safety plan</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="248.2607" x="606.5" y="326.5889">+ AoU forwarding (Usage Contract)</text></g><!--entity Recorders--><g id="elem_Recorders"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="219.0557" x="980" y="287.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="199.0557" x="990" y="310.292">mw::log Concrete Recorders</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="161.2051" x="990" y="326.5889">(file, remote/DLT, slog)</text></g><!--entity Integration--><g id="elem_Integration"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="257.5557" x="960.5" y="466.7969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="141.9551" x="970.5" y="489.792">Backend Integration</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="237.5557" x="970.5" y="506.0889">Artifacts (datarouter_backend, ...)</text></g><!--entity BackendPlan--><g id="elem_BackendPlan"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="301.7842" x="1253.5" y="466.7969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="142.6797" x="1263.5" y="489.792">Backend safety plan</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="281.7842" x="1263.5" y="506.0889">+ AoU forwarding (Integration Contract)</text></g><!--entity Runtime--><g id="elem_Runtime"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="186.3389" x="147.5" y="87.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="166.3389" x="157.5" y="110.292">Runtime Plugin Loading</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="105.9502" x="157.5" y="126.5889">(dlopen-based)</text></g><g id="elem_GMN19"><path d="M6,293.7969 L6,334.0625 L218.623,334.0625 L218.623,303.7969 L208.623,293.7969 L6,293.7969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M208.623,293.7969 L208.623,303.7969 L218.623,303.7969 L208.623,293.7969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="180.1338" x="12" y="310.8638">Not an assumed production</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="191.623" x="12" y="325.9966">commitment; decision-gated.</text></g><g id="elem_N1"><path d="M1611.5,435.2969 L1611.5,551.2266 L1879.9697,551.2266 L1879.9697,445.2969 L1869.9697,435.2969 L1611.5,435.2969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1869.9697,435.2969 L1869.9697,445.2969 L1879.9697,445.2969 L1869.9697,435.2969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="241.2617" x="1617.5" y="452.3638">Each repo owns its own phase gates,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="247.4697" x="1617.5" y="467.4966">safety plan, and governance; the only</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="229.5439" x="1617.5" y="482.6294">cross-repo contract is the Recorder</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="211.7705" x="1617.5" y="497.7622">interface + static backend_table</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="198.2563" x="1617.5" y="512.895">registration (plugin_api.h is an</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="194.7461" x="1617.5" y="528.0278">existing C ABI seam, not used</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="150.2935" x="1617.5" y="543.1606">for static composition).</text></g><!--link Frontend to Console--><g id="link_Frontend_Console"><path d="M565.36,140.3869 C541.16,151.2769 517.87,166.6569 502.5,188.2969 C481.95,217.2169 482.3915,254.0276 485.9415,281.1576 " fill="transparent" id="Frontend-to-Console" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="486.72,287.1069,489.5185,277.664,486.0713,282.1491,481.5861,278.7019,486.72,287.1069" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="187.8081" x="503.5" y="208.8638">static composition (baseline)</text></g><!--link Frontend to FrontendPlan--><g id="link_Frontend_FrontendPlan"><path d="M678.84,140.4869 C685.68,154.3769 693.75,171.9869 699.5,188.2969 C711.27,221.6969 720.37,261.6369 725.59,287.1069 " fill="transparent" id="Frontend-FrontendPlan" style="stroke:#181818;stroke-width:1;stroke-dasharray:7.0,7.0;"/></g><!--link Recorders to Integration--><g id="link_Recorders_Integration"><path d="M1089.5,340.6069 C1089.5,374.3569 1089.5,427.1269 1089.5,460.7469 " fill="transparent" id="Recorders-to-Integration" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="1089.5,466.7469,1093.5,457.7469,1089.5,461.7469,1085.5,457.7469,1089.5,466.7469" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="115.1147" x="1090.5" y="401.3638">static registration</text></g><!--link Recorders to BackendPlan--><g id="link_Recorders_BackendPlan"><path d="M1133.82,340.4369 C1154.89,352.5869 1180.46,367.2569 1203.5,380.2969 C1256.35,410.1969 1317.3,444.0769 1358.1,466.6669 " fill="transparent" id="Recorders-BackendPlan" style="stroke:#181818;stroke-width:1;stroke-dasharray:7.0,7.0;"/></g><!--reverse link Frontend to Recorders--><g id="link_Frontend_Recorders"><path d="M714.0211,143.4483 C735.8411,155.9983 757.66,168.0269 782.5,180.2969 C864.73,220.9269 962.4,261.8769 1025.13,287.2769 " fill="transparent" id="Frontend-backto-Recorders" style="stroke:#181818;stroke-width:1;stroke-dasharray:7.0,7.0;"/><polygon fill="#181818" points="708.82,140.4569,714.6273,148.4114,713.1542,142.9498,718.6159,141.4767,708.82,140.4569" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="202.2236" x="921.5471" y="201.3638">implements Recorder interface</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="310.3179" x="867.5" y="216.4966">(static registration via backend_table, baseline)</text></g><!--link Runtime to Frontend--><g id="link_Runtime_Frontend"><